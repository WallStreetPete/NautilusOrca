[project]
name = "blackorca"
version = "0.1.0"
description = "Black Orca Capital — AI-native hedge fund research and trading platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Black Orca Capital" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",

    # Data
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",          # only used at IO boundaries (yfinance, sklearn)
    "yfinance>=0.2.40",
    "requests>=2.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",

    # ML / stats
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "numba>=0.60",

    # Agents
    "anthropic>=0.40",

    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",

    # Plotting / reports
    "matplotlib>=3.9",
    "jinja2>=3.1",

    # Frontend
    "streamlit>=1.39",
    "plotly>=5.24",
    "networkx>=3.3",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
xgboost = ["xgboost>=2.1"]
nautilus = ["nautilus_trader>=1.190"]
alpaca = ["alpaca-py>=0.30"]
databento = ["databento>=0.40"]
langgraph = ["langgraph>=0.2", "langchain-anthropic>=0.2"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
    "types-beautifulsoup4",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
blackorca = "blackorca.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackorca"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle, pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "C4",                 # comprehensions
    "SIM",                # simplify
    "RUF",                # ruff-specific
    "ASYNC",
    "PTH",                # use pathlib
    "TID",
]
ignore = [
    "E501",   # let the formatter handle line length
    "B008",   # FastAPI Depends() and Typer Option() default-call pattern
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"scripts/**" = ["T201"]
"notebooks/**" = ["E", "F", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "lightgbm.*",
    "sklearn.*",
    "scipy.*",
    "statsmodels.*",
    "matplotlib.*",
    "numba.*",
    "duckdb.*",
    "databento.*",
    "alpaca.*",
    "alpaca_py.*",
    "nautilus_trader.*",
    "pgvector.*",
    "langgraph.*",
    "langchain_anthropic.*",
    "psycopg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (use -m slow to run)",
    "integration: integration tests (may hit network or local services)",
    "regression: strategy P&L baseline regression tests",
    "live: requires live API keys; skipped otherwise",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/blackorca"]
branch = true
